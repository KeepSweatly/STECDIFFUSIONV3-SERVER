# ============================================================
# STEC 条件扩散模型默认配置文件
# 多星联合建模、按历元组织样本、IPP点级划分、early stopping
# ============================================================

# ---- 实验基本信息 ----
experiment:
  name: "exp_joint_epoch"                    # 实验名称（多星联合训练）
  output_dir: "experiments"                  # 输出根目录（相对于项目根）
  seed: 2026                                 # 随机种子，保证可复现

# ---- 数据配置 ----
data:
  # 数据目录（按历元组织）
  model_stations_dir: "model_stations"       # 建模数据目录（训练+验证）
  val_stations_dir: "val_stations"           # 最终测试数据目录 
  
  # IPP 点级划分配置
  split_ratio: 0.8                           # 每个样本内 IPP 点划分比例（80% train, 20% val）

  # 样本过滤阈值（点数低于此值的历元不参与训练/验证，保证样本质量）
  min_points: 50                             # 历元总 IPP 点数下限（低于此值则过滤）
  min_test_context_ipps: 20                  # 最终测试时，context IPP 数小于此值则跳过
  min_test_target_ipps: 10                   # 最终测试时，target IPP 数小于此值则跳过

  # context/target 遮挡比例范围（训练时从训练点池中随机采样）
  mask_ratio_min: 0.10                       # target 点最少占比（10%，相对于训练点数）
  mask_ratio_max: 0.30                       # target 点最多占比（30%，相对于训练点数）

  # 归一化方式
  coord_norm: "minmax"                       # 坐标归一化：minmax → [-1, 1]
  stec_norm: "standard"                      # STEC 标准化：均值 0 方差 1

  # 卫星导航系统过滤（按单系统训练）
  # null: 全部系统联合训练（默认）
  # "GPS" / "BDS" / "Galileo" / "GLONASS" : 只训练指定系统
  system_filter: BDS

  seed: 2026                                 # 数据划分随机种子

# ---- 扩散过程（SDE）配置 ----
# 思路迁移自 EDiffSR/codes/utils/sde_utils.py 的 IRSDE
sde:
  T: 100                                     # 扩散总时间步数
  max_sigma: 2.0                             # 最大噪声标准差（STEC 已标准化，2.0 表示约 2 个训练集标准差）
  schedule: "cosine"                         # 噪声调度方式：cosine / linear / constant
  eps: 0.01                                  # 数值稳定的小量

# ---- Mu-REG 优化配置（第一阶段：显式先验特征）----
mu_reg:
  # 先验特征计算参数（这部分还需要调整，判断下到底需不需要这么多参数）
  prior_unc_a1: 1.0                          # 不确定度权重：距离项系数
  prior_unc_a2: 1.0                          # 不确定度权重：标准差项系数
  prior_unc_a3: 0.5                          # 不确定度权重：凸包外指示项系数
  prior_gap_k2: 2                            # prior_gap 计算时的 k=2 邻居数

  # 损失函数权重（第二阶段启用）
  lambda_w: 0.5                              # 弱条件损失权重
  lambda_x: 0.2                              # x0 重建损失权重
  lambda_j: 1.0e-4                           # Jacobian 稳定项权重
  lambda_smooth: 1.0e-3                      # 空间平滑/物理正则权重（弱正则，抑制 STEC 空间抖动）
  smooth_k: 8                                # 空间平滑：每个 target 点取最近 k 个邻居
  smooth_use_context: true                   # 空间平滑：邻居是否包含 context 真实观测锚点

  # Guidance 参数（第三、四阶段启用）
  guidance_scale_max: 2.0                    # 最大 guidance 强度
  guidance_beta: 1.0                         # 不确定度抑制系数
  weak_context_dropout: 0.2                  # 弱条件分支 context dropout 比例

  # 时步调度（第五阶段启用）
  guidance_schedule: "sin2"                  # 时步调度函数：sin2 / linear / constant

  # REG 矫正（推理时 Jacobian 矫正，对应 REG 论文 Eq.21）
  use_reg: true                              # true=使用REG矫正，false=普通CFG风格

# ---- 模型配置 ----
model:
  dim: 512                                   # Transformer 隐层维度
  depth: 4                                   # Transformer 层数
  heads: 8                                   # 注意力头数
  mlp_ratio: 4.0                             # FFN 扩展比例
  dropout: 0.0

  # 位置编码配置
  fourier_bands: 64                          # 坐标傅里叶特征频率数量（lat/lon）
  angle_fourier_bands: 32                    # 角度傅里叶特征频率数量（azimuth/elevation）

  # 时间步嵌入维度
  time_emb_dim: 256

  # 系统 ID embedding 维度
  system_emb_dim: 32                         # system_id 的 embedding 维度

  # RoPE 预计算最大序列长度（需大于单批次最大 IPP 点数）
  max_seq_len: 2048                          # RoPE 预计算上限（与 max_points 解耦）

# ---- 训练配置 ----
training:
  batch_size: 32                                # Flash/Efficient Attention 节省显存，可用更大 batch
  gradient_accumulation_steps: 1               # 梯度累积步数（等效 batch_size = 4×8 = 32）
  num_epochs: 500
  learning_rate: 1.0e-5                        # 从头训练时的初始学习率
  resume_lr: null                              # resume 时覆盖学习率；null 则沿用 learning_rate（不纳入命名）
  weight_decay: 1.0e-4
  grad_clip: 1.0                             # 梯度裁剪范数
  warmup_epochs: 10                          # 学习率 warmup 轮数

  # checkpoint 保存频率
  save_every_epochs: 20

  # 验证配置（基于 IPP 点级划分）
  val_start_step: 1300                       # validation 启动参数更新步数（1300 次 optimizer.step 后开始）
  val_interval: 500                          # validation 间隔参数更新步数

  # Early stopping 配置
  early_stopping_patience: 10                # 连续多少次 validation 无改善则停止训练

  # 验证指标模式
  # "global": 将所有样本的 target IPP 点汇总后统一计算 MAE/RMSE（默认）
  # "per_sample": 每个样本单独计算 RMSE，然后取所有样本的平均值
  val_metric_mode: "per_sample"

  # 使用设备
  device: "cuda"                             # cuda 或 cpu

# ---- 推理配置 ----
inference:
  checkpoint_path: ""                        # 推理时指定 checkpoint 路径（脚本参数可覆盖）

  # 评估模式：direct(模型直接预测val IPP) / product(格网产品+16角点IDW) / both
  # CLI --eval-mode 可覆盖此项；默认 direct（向后兼容）
  eval_mode: "direct"

  # 推理时 SDE 反向步数（可少于训练 T 以加速）
  num_steps: 100
  # IDW 插值参数（用于构建 target 处的条件均值 μ）
  idw_power: 2.0                             # IDW 距离幂次
  idw_k: 20                                   # IDW 取最近 k 个 context 点
  # 结果导出配置
  result_output_dir: "results/final_test"    # 测试结果导出目录
  export_all_predictions: true               # 是否导出完整预测结果（all_predictions.csv）

  # 测试时间段过滤（精确到年月日时，格式 "YYYYMMDD_HH"）
  # null 表示不过滤（使用全部样本）
  test_time_start: null                      # 起始时间，如 "20240218_06"
  test_time_end: null                        # 结束时间，如 "20240218_12"

  # ---- 格网产品评估（eval_mode = product / both 时启用）----
  # 模拟服务端播发规则 4D 格网产品，用户端按自身 IPP 的 16 角点 IDW 插值。
  # 内存友好：corner-only 仅预测 val 点所在 cell 的去重角点，不存完整格网。
  product_eval:
    # 4D 格网范围（lat/lon 未配置时从 normalizer 训练范围推断）
    lat_min: null                            # null → 用 coord_norm.lat_min
    lat_max: null
    lon_min: null
    lon_max: null
    az_min: 0.0                              # 方位角范围 [0, 360]
    az_max: 360.0
    el_min: 0.0                              # 高度角范围 [0, 90]
    el_max: 90.0

    # 各维分辨率（步长，含终点）
    lat_res: 2.0                             # 纬度分辨率（度）
    lon_res: 2.0                             # 经度分辨率（度）
    az_res: 30.0                             # 方位角分辨率（度）
    el_res: 15.0                             # 高度角分辨率（度）

    idw_power: 2.0                           # 16 角点 IDW 距离幂次
    chunk_size: 4096                         # 每块最多预测多少角点（防显存溢出）
    corner_only: true                        # corner-only 优化：仅预测所需去重角点
